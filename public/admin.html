<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Valley Admin</title>
<link rel="stylesheet" href="/style.css">
<style>body{overflow:auto}#wrap{max-width:760px;margin:auto;padding:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}.mono{font-family:ui-monospace,monospace;word-break:break-all;direction:ltr;unicode-bidi:plaintext}.adm-group{margin:20px 2px 8px;font-size:14px;color:var(--lime)}.adm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.adm-f{display:grid;gap:4px;margin-top:8px;min-width:0}.task-edit.off{opacity:.6}.task-edit select{width:100%}.lvtbl{width:100%;border-collapse:collapse;font-size:11px;text-align:center}.lvtbl th{color:var(--lime);padding:5px 3px;border-bottom:1px solid var(--line)}.lvtbl td{padding:5px 3px;border-bottom:1px solid #1f3425}.lvtbl tr:nth-child(2) td{background:#1a3322}</style>
</head>
<body>
<div id="wrap">
  <div id="login" class="card" hidden>
    <h3>🌱 Green Valley — لوحة الإدارة</h3>
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="go" class="btn full" style="margin-top:10px">دخول</button>
    <div id="lerr" class="bad sm" style="margin-top:8px"></div>
  </div>
  <div id="panel" hidden>
    <div class="seg" id="nav"></div>
    <div id="out"></div>
  </div>
</div>
<script src="/admin.js" type="module"></script>
</body>
</html>
