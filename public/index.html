<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#102116">
<meta name="description" content="Green Valley — grow a little world of your own.">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preload" as="image" href="/assets/farm-valley.webp" type="image/webp">
<title>Green Valley — Farming Simulator</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- AdsGram SDK: ads only run when block IDs are set in /admin → الإعلانات -->
<script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
<div id="boot" class="splash sp2" role="status" aria-live="polite">
  <svg class="sp2-scene" viewBox="0 0 360 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="spSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a1c"/><stop offset=".45" stop-color="#2a6b4a"/><stop offset=".78" stop-color="#f3c77a"/><stop offset="1" stop-color="#ffe3a6"/></linearGradient>
      <radialGradient id="spSun"><stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#ffd978" stop-opacity=".55"/><stop offset="1" stop-color="#ffd978" stop-opacity="0"/></radialGradient></defs>
    <rect width="360" height="640" fill="url(#spSky)"/>
    <g class="sp2-stars" fill="#fff"><circle cx="40" cy="60" r="1.4"/><circle cx="110" cy="110" r="1"/><circle cx="200" cy="50" r="1.5"/><circle cx="290" cy="95" r="1.1"/><circle cx="330" cy="40" r="1.3"/><circle cx="70" cy="170" r="1"/><circle cx="240" cy="150" r="1"/></g>
    <g transform="translate(180 430)"><circle r="150" fill="url(#spSun)"/><g class="sp2-rays" stroke="#fff3b8" stroke-width="2" opacity=".35" stroke-linecap="round"><path d="M0 -70v-40M0 70v40M-70 0h-40M70 0h40M50 -50l28 -28M-50 -50l-28 -28M50 50l28 28M-50 50l-28 28"/></g><circle r="34" fill="#fff0a8"/></g>
    <g class="sp2-cloud c1" fill="#fff" opacity=".85"><ellipse cx="70" cy="210" rx="34" ry="11"/><ellipse cx="94" cy="202" rx="24" ry="13"/><ellipse cx="50" cy="205" rx="20" ry="9"/></g>
    <g class="sp2-cloud c2" fill="#fff" opacity=".7"><ellipse cx="270" cy="270" rx="28" ry="9"/><ellipse cx="288" cy="263" rx="18" ry="10"/></g>
    <g class="sp2-far"><path d="M0 470 Q70 400 150 450 T300 430 T360 450 V640H0Z" fill="#3f8a57"/><g fill="#2c6d45"><polygon points="20,455 34,410 48,455"/><polygon points="52,458 70,400 88,458"/><polygon points="300,440 316,392 332,440"/><polygon points="330,446 344,408 358,446"/></g></g>
    <g class="sp2-mill" transform="translate(268 420)"><path d="M-9 40 L-5 -2 H5 L9 40Z" fill="#a8744a"/><g class="sp2-blades" stroke="#f1e0bb" stroke-width="3" stroke-linecap="round"><path d="M0 0 L0 -34M0 0 L0 34M0 0 L-34 0M0 0 L34 0"/></g><circle r="4" fill="#6b4429"/></g>
    <g transform="translate(70 452)"><rect x="-26" y="-4" width="52" height="42" fill="#b8402f"/><path d="M-30 -4 L0 -34 L30 -4Z" fill="#7a2c20"/><rect x="-8" y="14" width="16" height="24" fill="#f3e3c1"/><rect x="-20" y="4" width="9" height="9" fill="#ffd978"/><rect x="11" y="4" width="9" height="9" fill="#ffd978"/></g>
    <path d="M0 520 Q90 480 190 512 T360 500 V640H0Z" fill="#2f7a47"/>
    <g class="sp2-field" fill="none" stroke="#8a5e34" stroke-width="3" opacity=".75"><path d="M-10 585 Q180 545 370 585M-10 605 Q180 565 370 605M-10 625 Q180 585 370 625"/></g>
    <g class="sp2-sprouts" font-size="16"><text x="40" y="580">🌱</text><text x="120" y="566">🌿</text><text x="205" y="574">🌾</text><text x="285" y="566">🌱</text><text x="330" y="590">🌿</text></g>
    <g class="sp2-trees"><g transform="translate(24 500)"><rect x="-4" y="0" width="8" height="30" fill="#6b4429"/><circle cy="-8" r="26" fill="#2f7a3a"/><circle cx="-8" cy="-14" r="12" fill="#fff" opacity=".1"/></g><g transform="translate(338 506)"><rect x="-4" y="0" width="8" height="26" fill="#6b4429"/><circle cy="-8" r="22" fill="#3c8c43"/></g></g>
  </svg>
  <i class="sp2-leaf l1">🍃</i><i class="sp2-leaf l2">🍂</i><i class="sp2-leaf l3">🍃</i><i class="sp2-leaf l4">✦</i>
  <div class="sp2-content">
    <div class="sp2-logo"><div class="sp2-ring"></div><div class="sp2-core"><b>G</b><i>🌱</i></div></div>
    <div class="splash-wordmark">GREEN <b>VALLEY</b></div>
    <div class="splash-tagline" id="bootTag">A little land. A lot of possibilities.</div>
    <div class="sp2-loader"><div class="sp2-track"><i id="bootProgress"></i><span class="sp2-walker" id="bootWalker">🪓</span></div><div class="splash-loader-meta"><span id="bootStatus">Preparing your fields…</span><b id="bootPercent">08%</b></div><div class="sp2-tip" id="bootTip"></div></div>
  </div>
</div>
<div id="app" hidden>
  <header id="top"></header>
  <main id="view"></main>
  <nav id="tabs" aria-label="Main navigation"></nav>
</div>
<div id="sheet" hidden><div class="sheet-bg"></div><div class="sheet-body"></div></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="fx-layer" aria-hidden="true"></div>
<div id="celebrate" hidden data-act="celebrate" role="dialog" aria-live="polite"></div>
<div id="ambient" aria-hidden="true"><i>🍃</i><i>🍃</i><i>🌿</i><i>🍃</i><i>✦</i></div>
<script src="/app.js" type="module"></script>
</body>
</html>
